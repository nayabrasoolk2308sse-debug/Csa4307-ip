
<!DOCTYPE html>
<html>
<head>
    <title>CSS Layout Debugging</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="experiment3.css">
</head>
<body>

    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <main>
        <section class="content">
            <h2>Main Content</h2>
            <p>This is the main section of the webpage.</p>
            <p>Flexbox helps prevent overlapping elements.</p>
        </section>

        <aside>
            <h2>Sidebar</h2>
            <p>Additional information is shown here.</p>
        </aside>
    </main>

    <footer>
        <p>End of Website</p>
    </footer>

</body>
</html>
